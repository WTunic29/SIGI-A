version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sigi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sigi_user
      POSTGRES_PASSWORD: sigi_pass
      POSTGRES_DB: sigi
    ports:
      - "5432:5432"
    volumes:
      - sigi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigi_user -d sigi"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sigi_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "10000:10000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sigi_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  sigi_pgdata:
    driver: local

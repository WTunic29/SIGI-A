name: QA (pytest)

on:
  push:
    branches: [main, master, develop]
    paths:
      - "QA/**"
      - "backend/**"
      - ".github/workflows/qa-pytest.yml"
  pull_request:
    branches: [main, master, develop]
    paths:
      - "QA/**"
      - "backend/**"
      - ".github/workflows/qa-pytest.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-pytest-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: QA

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            QA/requirements-ci.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../backend/requirements.txt -r requirements-ci.txt

      - name: Validate Postman workspace
        run: python scripts/validate_postman_workspace.py

      - name: Check xfail budget
        run: python scripts/check_xfail_budget.py

      - name: Run pytest with coverage and JUnit
        env:
          SECRET_KEY: ci-secret-not-for-production
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"
          REFRESH_TOKEN_EXPIRE_DAYS: "7"
        run: |
          mkdir -p reports
          python -m pytest tests -v --tb=short --maxfail=5 \
            --junitxml=reports/junit.xml \
            --cov=app --cov-report=xml:reports/coverage.xml --cov-report=term-missing

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-pytest-reports
          path: |
            QA/reports/junit.xml
            QA/reports/coverage.xml
          if-no-files-found: warn

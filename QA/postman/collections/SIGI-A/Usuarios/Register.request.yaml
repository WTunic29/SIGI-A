$kind: http-request
name: Register Usuario
description: >-
  Alias de /auth/register — usa el mismo cuerpo que Auth/Register (incluye rol).
method: POST
url: '{{base_url}}/auth/register'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Juan",
      "apellido": "Pérez",
      "correo": "juan@example.com",
      "telefono": "3001234567",
      "password": "123456",
      "rol": "{{rol_default}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 201 - Usuario creado", () => pm.response.to.have.status(201));
      const json = pm.response.json();
      pm.expect(json).to.have.property("message");
      pm.expect(json).to.have.property("usuario");
      if (json.usuario) {
        pm.environment.set("id_usuario", json.usuario.id);
        pm.environment.set("correo_login", json.usuario.correo);
      }

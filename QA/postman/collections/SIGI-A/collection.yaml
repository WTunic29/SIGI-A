$kind: collection
name: SIGI-A
description: >-
  Colección SIGI-A para el backend FastAPI: /auth (2FA + JWT), /negocios, /empleados,
  /servicios, /productos, /citas, /pedidos, /pagos, /calificaciones, /notificaciones,
  health (/ y /test-db). Flujo: Register → Login → Verify-2FA → Bearer {{token}}.
  Cada request tiene un campo `order` numérico único (110…1120) para que el Collection
  Runner siga un orden lógico al ejecutar la colección entera. Incidencias API:
  QA/BACKEND_ISSUES_DETECTED.md (ej. POST /citas/ puede dar 500).
variables: []
auth: null
events: []
info:
  name: SIGI-A
  description: >-
    Colección SIGI-A — ver QA/postman/README.md (variables, flujo, orden del Runner).
  schema: 'https://schema.getpostman.com/json/collection/v2.1.0/collection.json'

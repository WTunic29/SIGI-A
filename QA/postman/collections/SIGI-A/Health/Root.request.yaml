$kind: http-request
name: Root
description: 'Verifica que el servidor esté corriendo'
method: GET
url: '{{base_url}}/'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200 - Backend funcionando", () => pm.response.to.have.status(200));
      pm.test("Respuesta tiene message", () => pm.expect(pm.response.json()).to.have.property("message"));
      pm.test("Mensaje contiene SIGI-A", () => pm.expect(pm.response.json().message).to.include("SIGI-A"));

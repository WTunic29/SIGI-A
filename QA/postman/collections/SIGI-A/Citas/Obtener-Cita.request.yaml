$kind: http-request
name: Listar citas del cliente (detalle por ID no expuesto)
description: >-
  El backend no expone GET /citas/{id} para una sola cita. Se usa GET /citas/cliente/{id_cliente}
  (mismo patrón que "Citas del Usuario"). Requiere token; el cliente solo puede su id_usuario.
method: GET
url: '{{base_url}}/citas/cliente/{{id_usuario}}'
order: 2000
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      const citas = pm.response.json();
      pm.test("Respuesta es array", () => pm.expect(Array.isArray(citas)).to.be.true);
      if (citas.length > 0) {
        const c = citas[0];
        pm.test("Elemento tiene id_cita", () => pm.expect(c).to.have.property("id_cita"));
        pm.test("Elemento tiene id_cliente", () => pm.expect(c).to.have.property("id_cliente"));
        pm.test("Estado válido", () => pm.expect(c.estado).to.be.oneOf(["pendiente", "confirmada", "cancelada", "completada", "no_asistio"]));
      }

$kind: http-request
name: Eliminar Producto
description: >-
  Desactiva un producto (estado inactivo). Respuesta JSON con campo message.
method: DELETE
url: '{{base_url}}/productos/{{id_producto}}'
order: 640
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200 - Producto desactivado", () => pm.response.to.have.status(200));
      pm.test("Respuesta tiene message", () => pm.expect(pm.response.json()).to.have.property("message"));

$kind: http-request
name: Actualizar Producto
description: Actualiza un producto (respuesta plana ProductoResponse).
method: PUT
url: '{{base_url}}/productos/{{id_producto}}'
order: 3000
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{token}}'
body:
  type: json
  content: |-
    {
      "nombre": "Shampoo Profesional Premium",
      "descripcion": "Shampoo para cabello dañado y teñido 500ml",
      "precio": 32000.00,
      "stock": 45,
      "estado": "activo"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200 - Producto actualizado", () => pm.response.to.have.status(200));
      const producto = pm.response.json();
      pm.test("Tiene id_producto", () => pm.expect(producto).to.have.property("id_producto"));
      pm.test("Tiene nombre", () => pm.expect(producto).to.have.property("nombre"));
      pm.test("precio definido", () => pm.expect(producto.precio).to.exist);
      pm.test("stock es mayor o igual a 0", () => pm.expect(producto.stock).to.be.at.least(0));
      pm.test("Estado es válido", () => pm.expect(producto.estado).to.be.oneOf(["activo", "inactivo"]));

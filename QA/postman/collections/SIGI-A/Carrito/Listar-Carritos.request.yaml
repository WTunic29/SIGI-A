$kind: http-request
name: Listar Carritos
description: GET /carritos/ — carritos del cliente autenticado (o todos si admin).
method: GET
url: '{{base_url}}/carritos/'
order: 1210
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Array", () => pm.expect(pm.response.json()).to.be.an("array"));
      const items = pm.response.json();
      if (items.length > 0) {
        const c = items[0];
        if (!pm.environment.get("id_carrito")) {
          pm.environment.set("id_carrito", String(c.id_carrito));
        }
        pm.test("id_carrito", () => pm.expect(c).to.have.property("id_carrito"));
      }

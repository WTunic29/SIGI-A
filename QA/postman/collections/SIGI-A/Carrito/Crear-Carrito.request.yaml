$kind: http-request
name: Crear Carrito
description: >-
  POST /carritos/ — cliente. id_usuario se toma del token; el body usa estado (ej. activo).
  Respuesta plana CarritoResponse.
method: POST
url: '{{base_url}}/carritos/'
order: 1200
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{token}}'
body:
  type: json
  content: |-
    {
      "id_usuario": {{id_usuario}},
      "estado": "activo"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200 - Carrito creado", () => pm.response.to.have.status(200));
      const c = pm.response.json();
      pm.test("CarritoResponse", () => {
        pm.expect(c).to.have.property("id_carrito");
        pm.expect(c).to.have.property("id_usuario");
        pm.expect(c).to.have.property("estado");
      });
      if (pm.response.code === 200 && c.id_carrito) {
        pm.environment.set("id_carrito", String(c.id_carrito));
      }

$kind: http-request
name: Actualizar Negocio
description: >-
  Actualiza campos del negocio (schema NegocioUpdate: nombre, descripcion,
  direccion, telefono, correo). Respuesta plana NegocioResponse.
method: PUT
url: '{{base_url}}/negocios/{{id_negocio}}'
order: 340
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{token}}'
body:
  type: json
  content: |-
    {
      "descripcion": "Centro de estética y belleza - actualizado",
      "telefono": "3009990000"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200 - Negocio actualizado", () => pm.response.to.have.status(200));
      const negocio = pm.response.json();
      pm.test("Respuesta plana con id_negocio", () => pm.expect(negocio).to.have.property("id_negocio"));
      pm.test("Tiene nombre_negocio", () => pm.expect(negocio).to.have.property("nombre_negocio"));
